[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toxifusionnet"
version = "0.1.0"
description = "Sarcasm-aware multi-task transformer for hate speech detection in Hindi-English code-mixed text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "transformers>=4.40", "tokenizers>=0.15", "numpy", "pandas>=2.0", "scikit-learn>=1.3", "scipy",
  "pyyaml", "openpyxl", "emoji>=2.0", "tqdm", "matplotlib",
]
[project.optional-dependencies]
explain = ["lime"]
serve = ["fastapi", "uvicorn", "httpx"]
dev = ["pytest"]
[project.scripts]
toxifusion = "toxifusionnet.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
