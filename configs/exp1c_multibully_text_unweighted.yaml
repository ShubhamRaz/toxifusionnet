# Experiment 1c: MultiBully-Only Text Baseline (Unweighted Control)
# Single-factor control baseline: pure cross-entropy without class re-weighting or focal modulation.
# Evaluates standard empirical risk minimization across all 4 tasks.
experiment_name: exp1c_multibully_text_unweighted
data:
  processed_path: data/processed/multibully.csv
  max_length: 128
labels:
  target: [individual, organization, community, society]
model:
  encoder_name: xlm-roberta-base
  tasks: [sarcasm, hate, target, severity]
  dropout: 0.1
  head_hidden: 256
  use_sarcasm_branch: true
  use_fusion: true
  use_cue_features: true
  cue_hidden: 32
  use_clip: false                # Text-only baseline
loss:
  weighting: fixed
  weights: {sarcasm: 1.0, hate: 1.0, target: 1.0, severity: 1.0}
  class_weighting: none
  focal_gamma: 0.0
  severity_loss_type: ce
train:
  epochs: 8
  batch_size: 64
  steps_per_epoch: 61
  max_steps: 488
  warmup_ratio: 0.10
  encoder_lr: 1.0e-5
  head_lr: 5.0e-4
  weight_decay: 0.01
  patience: 3
  fp16: true
  device: auto
