# Experiment 7: MultiBully + HOT Combined with CLIP Multimodal Fusion
# Evaluates visual fusion for real memes combined with auxiliary text supervision (image masked for HOT)
experiment_name: exp7_combined_clip
data:
  processed_path: data/processed/multibully.csv
  aux_path: data/processed/hot_v2.csv
  image_dir: data/raw/bully_data/bully_data
  max_length: 128
labels:
  target: [individual, organization, community, society]
model:
  encoder_name: xlm-roberta-base
  tasks: [sarcasm, hate, target, severity]
  dropout: 0.1
  head_hidden: 256
  use_sarcasm_branch: true
  use_fusion: true
  use_cue_features: true
  cue_hidden: 32
  use_clip: true                 # Multimodal enabled for MultiBully memes; masked for HOT
  freeze_clip: true              # Frozen vision backbone to prevent overfitting
  clip_model_name: openai/clip-vit-base-patch32
loss:
  weighting: fixed
  weights: {sarcasm: 1.0, hate: 1.0, target: 1.0, severity: 1.0}
  class_weighting: balanced
  focal_gamma: 2.0
train:
  epochs: 8
  batch_size: 64
  encoder_lr: 1.0e-5
  head_lr: 5.0e-4
  weight_decay: 0.01
  patience: 3
  fp16: true
  device: auto
