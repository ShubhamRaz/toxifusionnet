# Experiment Proposed: Meme-Level Hate Multimodal CLIP Fusion
# Evaluates multimodal fusion against whole-meme hate ground truth (Img-Text-Label)
experiment_name: exp_memehate_clip
data:
  processed_path: data/processed/multibully_memehate.csv
  cv_folds_path: data/processed/multibully_v2_cv_folds.csv
  image_dir: data/raw/bully_data/bully_data
  max_length: 128
labels:
  target: [individual, organization, community, society]
model:
  encoder_name: xlm-roberta-base
  tasks: [sarcasm, hate, target, severity]
  dropout: 0.1
  head_hidden: 256
  use_sarcasm_branch: true
  use_fusion: true
  use_cue_features: true
  cue_hidden: 32
  use_clip: true                 # Multimodal CLIP Vision Fusion
loss:
  weighting: fixed
  weights: {sarcasm: 1.0, hate: 1.0, target: 1.0, severity: 1.0}
  class_weighting: balanced
  focal_gamma: 2.0
train:
  epochs: 8
  batch_size: 64
  encoder_lr: 1.0e-5
  head_lr: 5.0e-4
  weight_decay: 0.01
  patience: 3
  fp16: true
  device: auto
