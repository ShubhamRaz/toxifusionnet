# Experiment 4: Multi-Dataset Combined with CLIP for MultiBully and Text-Only for HOT
# Evaluates multi-corpus supervision with modality-masked visual features
experiment_name: exp4_multidataset_clip
data:
  processed_path: data/processed/combined_multibully_hot.csv
  image_dir: data/raw/bully_data/bully_data
  max_length: 128
labels:
  target: [individual, organization, community, society]
model:
  encoder_name: xlm-roberta-base
  tasks: [sarcasm, hate, target, severity]
  dropout: 0.1
  head_hidden: 256
  use_sarcasm_branch: true
  use_fusion: true
  use_cue_features: true
  cue_hidden: 32
  use_clip: true                 # Enabled for meme samples; masked out for text-only HOT samples
  freeze_clip: true
  clip_model_name: openai/clip-vit-base-patch32
loss:
  weighting: fixed
  weights: {sarcasm: 1.0, hate: 1.0, target: 0.5, severity: 0.5}
  class_weighting: balanced
  focal_gamma: 2.0
train:
  epochs: 8
  batch_size: 32
  encoder_lr: 1.0e-5
  head_lr: 5.0e-4
  weight_decay: 0.01
  patience: 3
  fp16: true
  device: auto
