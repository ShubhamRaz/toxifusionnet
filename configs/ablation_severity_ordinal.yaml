# Severity Ablation 4: Ordinal Distance-Penalized Loss
# Hypothesis: Penalizes severe ordinal misrankings (|k - y|) to avoid extreme distance-2 blunders (predicting low for high).
experiment_name: ablation_severity_ordinal
data:
  processed_path: data/processed/multibully.csv
  max_length: 128
labels:
  target: [individual, organization, community, society]
model:
  encoder_name: xlm-roberta-base
  tasks: [sarcasm, hate, target, severity]
  dropout: 0.1
  head_hidden: 256
  use_sarcasm_branch: true
  use_fusion: true
  use_cue_features: true
  cue_hidden: 32
  use_clip: false
loss:
  weighting: fixed
  weights: {sarcasm: 1.0, hate: 1.0, target: 1.0, severity: 1.0}
  class_weighting: balanced
  focal_gamma: 0.0
  severity_loss_type: ordinal
  ordinal_penalty_weight: 0.5
train:
  epochs: 8
  batch_size: 64
  encoder_lr: 1.0e-5
  head_lr: 5.0e-4
  weight_decay: 0.01
  patience: 3
  fp16: true
  device: auto
