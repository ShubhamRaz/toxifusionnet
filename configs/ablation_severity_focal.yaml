# Severity Ablation 3: Balanced Focal Loss
# Hypothesis: Tests non-linear focal loss (gamma=2.0) to focus gradients on hard minority examples (high severity).
experiment_name: ablation_severity_focal
data:
  processed_path: data/processed/multibully.csv
  max_length: 128
labels:
  target: [individual, organization, community, society]
model:
  encoder_name: xlm-roberta-base
  tasks: [sarcasm, hate, target, severity]
  dropout: 0.1
  head_hidden: 256
  use_sarcasm_branch: true
  use_fusion: true
  use_cue_features: true
  cue_hidden: 32
  use_clip: false
loss:
  weighting: fixed
  weights: {sarcasm: 1.0, hate: 1.0, target: 1.0, severity: 1.0}
  class_weighting: balanced
  focal_gamma: 2.0
  severity_loss_type: ce
train:
  epochs: 8
  batch_size: 64
  encoder_lr: 1.0e-5
  head_lr: 5.0e-4
  weight_decay: 0.01
  patience: 3
  fp16: true
  device: auto
