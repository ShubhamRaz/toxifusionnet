# Experiment: ToxiFusionNet on Balanced Hinglish Toxicity Dataset (48k)
# Text-only XLM-RoBERTa backbone with Sarcasm-Aware Gated Fusion
experiment_name: hinglish_balanced_xlmr
data:
  processed_path: data/processed/hinglish_balanced.csv
  max_length: 128
labels:
  target: [individual, organization, community, society]
model:
  encoder_name: xlm-roberta-base
  tasks: [sarcasm, hate, target, severity]
  dropout: 0.1
  head_hidden: 256
  use_sarcasm_branch: true
  use_fusion: true
  use_cue_features: true
  cue_hidden: 32
  use_clip: false                # Pure text encoder (no vision input)
loss:
  weighting: fixed
  weights: {sarcasm: 1.0, hate: 1.0, target: 1.0, severity: 1.0}
  class_weighting: balanced
  focal_gamma: 2.0
train:
  epochs: 5
  batch_size: 16                 # Tailored for RTX 3050 6GB Laptop GPU
  encoder_lr: 1.0e-5
  head_lr: 5.0e-4
  weight_decay: 0.01
  patience: 3
  fp16: true                     # FP16 mixed precision for fast GPU execution
  device: auto
