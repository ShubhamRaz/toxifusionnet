# Smoke test for simplified 4-task binary schema
experiment_name: smoke_simplified
data:
  processed_path: data/cleaned/multibully_simplified.csv
  max_length: 16
labels:
  target: [target_absent, target_present]
  severity: [low, moderate_or_high]
model:
  encoder_name: tiny
  tiny_hidden: 32
  tiny_layers: 1
  head_hidden: 32
  tasks: [sarcasm, hate, target, severity]
  use_sarcasm_branch: true
  use_fusion: true
  use_cue_features: true
  cue_hidden: 16
loss:
  weighting: fixed
  weights: {sarcasm: 1.0, hate: 1.0, target: 1.0, severity: 1.0}
  class_weighting: none
  focal_gamma: 0.0
train:
  epochs: 1
  batch_size: 16
  encoder_lr: 1.0e-3
  head_lr: 1.0e-3
  device: cpu
